annotations: {readOnlyHint: true, idempotentHint: true}
---
kind: tool
name: redis_persistence
type: http
source: adapter
method: GET
path: /v1/tools/redis_persistence
description: Redis persistence state. Last RDB save time and status, changes since the last save, AOF enabled/rewrite/write status, and loading state.
annotations: {readOnlyHint: true, idempotentHint: true}
---
kind: tool
name: redis_replication_status
type: http
source: adapter
method: GET
path: /v1/tools/redis_replication_status
description: Redis replication role, connected replicas with offset and lag, and master link status on a replica. replication is not_configured for a standalone primary, which is a normal state.
annotations: {readOnlyHint: true, idempotentHint: true}
---
kind: tool
name: redis_configuration
type: http
source: adapter
method: GET
path: /v1/tools/redis_configuration
description: Allowlisted, non-sensitive Redis settings covering memory limit and policy, maxclients, timeouts, lazyfree, slowlog and latency thresholds, protected mode and replica settings. Passwords are never returned.
annotations: {readOnlyHint: true, idempotentHint: true}
---
kind: tool
name: redis_acl_users
type: http
source: adapter
method: GET
path: /v1/tools/redis_acl_users
description: Redis ACL user names with enabled state, nopass flag and password count. Password hashes are never returned.
annotations: {readOnlyHint: true, idempotentHint: true}
---
kind: tool
name: redis_acl_permissions
type: http
source: adapter
method: GET
path: /v1/tools/redis_acl_permissions
description: Permissions of one Redis ACL user. Flags, allowed and denied commands, key patterns, channel patterns and selectors, with password hashes removed (count only).
queryParams:
  - {name: user, type: string, description: "ACL user name (from redis_acl_users)."}
annotations: {readOnlyHint: true, idempotentHint: true}
---
kind: tool
name: redis_keyspace_overview
type: http
source: adapter
method: GET
path: /v1/tools/redis_keyspace_overview
description: Per logical database Redis key counts, keys with expiry, expiring percent and average TTL. Taken from INFO keyspace; no key enumeration.
annotations: {readOnlyHint: true, idempotentHint: true}
---
kind: tool
name: redis_persistence_configuration
type: http
source: adapter
method: GET
path: /v1/tools/redis_persistence_configuration
description: Redis persistence settings. RDB save schedule, appendonly and appendfsync, AOF rewrite thresholds, RDB compression and checksum, stop-writes-on-bgsave-error, and whether an ACL file is configured (path not returned).
annotations: {readOnlyHint: true, idempotentHint: true}

