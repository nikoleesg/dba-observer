[project]
name = "dba-observer"
version = "0.1.0"
description = "Read-only DBA observer MCP server for MySQL, PostgreSQL and Redis: Google MCP Toolbox plus a narrow adapter for Redis, per-database PostgreSQL catalog and meta tools."
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "Niko Lee" }]
keywords = ["mcp", "model-context-protocol", "dba", "mysql", "postgresql", "redis", "mcp-toolbox"]

# The adapter only. Toolbox is a separate binary (docker/toolbox.Dockerfile).
dependencies = [
    "redis>=5.2,<7",
    "psycopg[binary]>=3.2,<4",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
]

[project.scripts]
dba-observer-adapter = "dba_observer.__main__:main"

[project.urls]
Repository = "https://github.com/nikoleesg/dba-observer"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dba_observer"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: needs the docker test stack (tests/stack/compose.yaml)"]
